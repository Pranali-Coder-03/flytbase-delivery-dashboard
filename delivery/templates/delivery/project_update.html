<!DOCTYPE html>
<html>

<head>

    <title>Project Update</title>

    <style>

        body {
            font-family: Arial;
            background: #f5f7fb;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        h1 {
            margin-top: 0;
        }

        .project {
            color: #6b7280;
            margin-bottom: 30px;
        }

        button {
            background: #111827;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        Add Project Update
    </h1>

    <div class="project">

        {{ project.name }}
        —
        {{ project.customer_name }}

    </div>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Process Update
        </button>

    </form>

</div>

</body>

</html>
